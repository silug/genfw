name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target: current Fedora. Core perl is split into many
          # small packages here, so each module is listed explicitly.
          - name: Fedora
            container: fedora:latest
            install: >-
              dnf install -y --setopt=install_weak_deps=False
              git make perl perl-DirHandle perl-Test-Simple perl-Test-Harness
              perl-Test-Pod perl-ExtUtils-MakeMaker perl-podlators
          # Enterprise Linux 9 (perl-Test-Pod is EPEL-only; the POD test
          # skips itself when the module is missing).
          - name: EL9
            container: almalinux:9
            install: >-
              dnf install -y --setopt=install_weak_deps=False
              git make perl perl-DirHandle perl-Test-Simple perl-Test-Harness
              perl-ExtUtils-MakeMaker perl-podlators
          # Debian-family runner with a stock perl, which bundles the core
          # modules. Runs directly on the host runner (no container).
          - name: Ubuntu
            container: ''
            install: >-
              sudo apt-get update -q &&
              sudo apt-get install -y -q --no-install-recommends
              make perl libtest-pod-perl netbase iptables
    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Show perl version
        run: perl -v | sed -n 2p

      - name: Run tests
        run: make test

  # EL7 and EL8 are the only platforms genfw fully supports today (they still
  # have network-scripts and the iptables compatibility layer), so Perl 5.16
  # is the floor. CentOS 7 is too old for the Node runtime GitHub Actions
  # uses, so it cannot be a job container; run it with docker from the host
  # instead. Its mirrors are gone, so yum is pointed at the vault.
  el7:
    name: Test suite (EL7, Perl 5.16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NET_ADMIN lets the container load the generated ruleset with EL7's
      # legacy iptables-restore (1.4.21), the oldest loader genfw targets.
      - name: Run the suite in a CentOS 7 container, then load the sample ruleset
        run: |
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW -v "$PWD:/src:ro" quay.io/centos/centos:7 bash -e -c '
            sed -i -e "s|^mirrorlist=|#mirrorlist=|g" \
                   -e "s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" \
                   /etc/yum.repos.d/CentOS-*.repo
            yum install -y -q perl perl-Test-Simple perl-Test-Harness perl-ExtUtils-MakeMaker make iptables
            cp -r /src /work && cd /work
            perl -v | sed -n 2p
            make test
            iptables-restore --version
            cd t/sample
            perl ../../genfw -d 2>/dev/null > /tmp/sample.rules
            perl ../../genfw -d -i 2>/dev/null
            echo "rules generated: $(grep -c "^-A" /tmp/sample.rules), loaded: $(iptables-save | grep -c "^-A")"
            test "$(grep -c "^-A" /tmp/sample.rules)" -eq "$(iptables-save | grep -c "^-A")"
          '

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git perl perl-DirHandle perl-Perl-Critic ShellCheck rpmlint

      - uses: actions/checkout@v4

      # Severity and output format come from .perlcriticrc in the repo root.
      - name: perlcritic
        run: perlcritic genfw t/lib/GenfwTest.pm t/*.t

      # install.sh is POSIX sh. firewall.init sources /etc/init.d/functions,
      # which is bash, so it is checked as bash.
      - name: shellcheck shell scripts
        run: |
          shellcheck --severity=warning install.sh hooks/*
          shellcheck --severity=warning --shell=bash firewall.init

      # rpmlint picks up genfw.rpmlintrc automatically. Its spelling filter
      # only matches built packages, so tell rpmlint not to fail on the
      # filter being unused for a bare spec.
      - name: rpmlint spec
        run: rpmlint --ignore-unused-rpmlintrc genfw.spec

  # Debian packaging: build the .deb (the suite runs inside the build via
  # dh_auto_test), lint it, then install it on Debian and Ubuntu and run the
  # installed genfw. Installation must not enable the units.
  deb:
    name: Debian package build and install
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - name: Install build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential debhelper perl lintian iproute2 netbase git

      - uses: actions/checkout@v4

      - name: Build
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && cp ../genfw_*.deb dist/
          ls -l dist

      - name: lintian
        run: lintian --fail-on warning,error --info dist/genfw_*.deb

      - name: Install and run
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ./dist/genfw_*.deb systemd
          dpkg -L genfw
          test -x /usr/sbin/genfw
          test -x /etc/network/if-up.d/genfw
          test -x /usr/lib/NetworkManager/dispatcher.d/90-genfw
          man -w genfw
          systemd-analyze verify /usr/lib/systemd/system/genfw.service /usr/lib/systemd/system/genfw-online.service
          # Nothing may be enabled by installation.
          test ! -e /etc/systemd/system/multi-user.target.wants/genfw.service
          test ! -e /etc/systemd/system/multi-user.target.wants/genfw-online.service
          cd t/sample && /usr/sbin/genfw -d 2>/dev/null | grep -c '^-A'

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/
          if-no-files-found: error

  rpm:
    name: RPM build and install (Fedora)
    runs-on: ubuntu-latest
    # NET_ADMIN so the installed genfw can load a ruleset with -i for real.
    container:
      image: fedora:latest
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW
    steps:
      - name: Install build tools
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git make rpm-build rpmdevtools rpmlint 'dnf-command(builddep)'
          perl perl-ExtUtils-MakeMaker systemd man-db glibc-langpack-en

      - uses: actions/checkout@v4

      - name: Install BuildRequires from the spec
        run: dnf builddep -y genfw.spec

      - name: Build tarball and source RPM
        run: make dist

      # Building from the tarball runs %prep, %build, %check (the test
      # suite), and %install exactly as a packager would see them.
      - name: Build binary RPM
        run: |
          rpmdev-setuptree
          rpmbuild -ta genfw-*.tar.gz

      - name: rpmlint packages
        run: rpmlint -r genfw.rpmlintrc ~/rpmbuild/RPMS/noarch/genfw-*.rpm genfw-*.src.rpm

      - name: Inspect package contents
        run: |
          rpm -qlp ~/rpmbuild/RPMS/noarch/genfw-*.rpm
          rpm -qp --requires ~/rpmbuild/RPMS/noarch/genfw-*.rpm

      # Installing checks that every Requires (including the ones
      # perl-generators derives from "use" lines) resolves in a clean
      # Fedora, then exercises the installed files.
      # tsflags is cleared because container images set tsflags=nodocs, which
      # would skip the man page we want to check.
      - name: Install the package
        run: >-
          dnf install -y --setopt=install_weak_deps=False --setopt=tsflags=
          ~/rpmbuild/RPMS/noarch/genfw-*.rpm

      - name: Smoke test installed files
        run: |
          set -x
          test -x /usr/sbin/genfw
          test -f /usr/share/man/man8/genfw.8.gz
          man -w genfw
          systemd-analyze verify /usr/lib/systemd/system/genfw.service /usr/lib/systemd/system/genfw-online.service
          test -x /usr/lib/NetworkManager/dispatcher.d/90-genfw
          test -x /usr/lib/networkd-dispatcher/routable.d/90-genfw
          # Scriptlets differ by platform (file triggers on Fedora, explicit
          # systemctl calls on EL); show them rather than assert on them.
          rpm -q --scripts genfw || true
          iptables-restore --version

      # The real thing: the installed genfw generates and loads the sample
      # ruleset with -i, and iptables-save reports every rule.
      - name: Load the sample ruleset with genfw -i
        working-directory: t/sample
        run: |
          /usr/sbin/genfw -d 2>/dev/null > /tmp/sample.rules
          /usr/sbin/genfw -d -i
          echo "rules generated: $(grep -c '^-A' /tmp/sample.rules), loaded: $(iptables-save | grep -c '^-A')"
          test "$(grep -c '^-A' /tmp/sample.rules)" -eq "$(iptables-save | grep -c '^-A')"

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: |
            ~/rpmbuild/RPMS/noarch/genfw-*.rpm
            genfw-*.src.rpm
          if-no-files-found: error
