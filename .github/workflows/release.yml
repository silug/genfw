name: Release

# Builds, signs, verifies, and publishes a release when a version tag is
# pushed. Creating a release in the GitHub UI also creates the tag and so
# triggers this; the release step then updates that release instead of
# creating a new one. Either order works.
#
# Tag format: v<version>[-<suffix>]. <version> must equal $VERSION in genfw
# and Version: in genfw.spec. A suffix (v1.51-rc1) marks a prerelease and
# lets the pipeline be exercised without publishing a "latest" release.
#
# Signing uses a GPG key from the "release" environment's secrets
# (GPG_PRIVATE_KEY, GPG_PASSPHRASE). Protect that environment with a
# required reviewer so a release needs a human approval. A prerelease can
# run without the key (assets are then unsigned and the job says so); a
# real release requires it.
#
# The RPM is built on EL8, the oldest platform with usable container images
# and mirrors, so that one noarch package installs everywhere from EL7 up:
# rpm format features only grow, so building on the oldest target avoids
# chasing each new default (Fedora's zstd payloads and merged /usr/sbin have
# both already bitten). The verify job then installs it on EL7, EL9, and
# Fedora. rpmlint runs in the regular test workflow on Fedora, where it is
# current; EL8's is too old to know SPDX license names.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign (EL8)
    runs-on: ubuntu-latest
    environment: release
    container: almalinux:8
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Install build and signing tools
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git make rpm-build rpm-sign rpmdevtools 'dnf-command(builddep)'
          gnupg2 perl systemd

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A real release must come from master. A prerelease may be tagged on
      # any branch, which is how the pipeline is rehearsed; the check still
      # runs for it so a rehearsal exercises these git commands, but only
      # reports. The checkout is owned by a different uid than the
      # container's user, so git must be told the directory is safe.
      - name: Check that a release tag points at a commit on master
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag='${{ github.ref_name }}'
          git fetch --no-tags origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "tag $tag ($GITHUB_SHA) is on master"
          else
            case "${tag#v}" in
              *-*) echo "::notice::prerelease tag $tag is not on master; allowed for a rehearsal";;
              *)   echo "::error::tag $tag points at $GITHUB_SHA, which is not on master"; exit 1;;
            esac
          fi

      - name: Check that the tag matches the version in genfw, genfw.spec, and debian/changelog
        id: version
        run: |
          tag='${{ github.ref_name }}'
          version="${tag#v}"; version="${version%%-*}"
          prerelease=false; [ "$version" != "${tag#v}" ] && prerelease=true
          script_version=$(perl -ne 'print $1 if /^our \$VERSION\s*=\s*"([^"]+)"/' genfw)
          spec_version=$(awk '/^Version:/ {print $2}' genfw.spec)
          deb_version=$(head -1 debian/changelog | sed 's/^genfw (\(.*\)).*/\1/')
          echo "tag=$tag version=$version genfw=$script_version spec=$spec_version deb=$deb_version prerelease=$prerelease"
          [ "$version" = "$script_version" ] || { echo "::error::tag $tag does not match \$VERSION $script_version in genfw"; exit 1; }
          [ "$version" = "$spec_version" ]   || { echo "::error::tag $tag does not match Version $spec_version in genfw.spec"; exit 1; }
          [ "${deb_version%-*}" = "$version" ] || { echo "::error::tag $tag does not match debian/changelog version $deb_version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Require a signing key for a real release
        if: steps.version.outputs.prerelease == 'false' && env.GPG_PRIVATE_KEY == ''
        run: |
          echo "::error::GPG_PRIVATE_KEY is not set in the release environment; a non-prerelease tag must be signed"
          exit 1

      - name: Install BuildRequires from the spec
        run: dnf builddep -y genfw.spec

      # One noarch RPM for every supported platform, so no dist tag. EL8's
      # rpm defaults (xz payload, real /usr/sbin) already suit EL7.
      - name: Configure rpmbuild for portable output
        run: |
          cat > ~/.rpmmacros <<'EOM'
          %dist %{nil}
          %_gpg_digest_algo sha256
          EOM
          rpm --version
          rpm --eval 'sbindir=%{_sbindir} payload=%{?_binary_payload}'

      - name: Build tarball, source RPM, and binary RPM
        run: |
          make dist
          rpmdev-setuptree
          rpmbuild -ta genfw-*.tar.gz
          mkdir -p dist
          cp genfw-*.tar.gz genfw-*.src.rpm ~/rpmbuild/RPMS/noarch/genfw-*.noarch.rpm dist/
          ls -l dist
          echo "::group::package contents and rpmlib requirements"
          rpm -qlp dist/genfw-*.noarch.rpm
          rpm -qp --requires dist/genfw-*.noarch.rpm | grep rpmlib
          echo "::endgroup::"
          # The systemd unit runs /usr/sbin/genfw; a build host with merged
          # /usr/sbin would silently put it in /usr/bin instead.
          rpm -qlp dist/genfw-*.noarch.rpm | grep -qx /usr/sbin/genfw

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::no secret key imported"; exit 1; }
          echo "GPG_FPR=$fpr" >> "$GITHUB_ENV"
          echo "%_gpg_name $fpr" >> ~/.rpmmacros
          gpg-connect-agent /bye
          for grip in $(gpg --list-secret-keys --with-colons --with-keygrip | awk -F: '/^grp/ {print $10}'); do
            /usr/libexec/gpg-preset-passphrase --preset --passphrase "$GPG_PASSPHRASE" "$grip"
          done
          # The public key ships as a release asset; it is not kept in the
          # repository, so rotating the key only means replacing the secrets.
          gpg --armor --export "$fpr" > dist/RPM-GPG-KEY-genfw
          gpg --show-keys dist/RPM-GPG-KEY-genfw

      - name: Sign the RPMs and the tarball
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          rpmsign --addsign dist/*.rpm
          rpm --import dist/RPM-GPG-KEY-genfw
          rpm -K dist/*.rpm
          gpg --batch --yes --armor --detach-sign dist/genfw-*.tar.gz

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum genfw-* > SHA256SUMS
          if [ -n "$GPG_PRIVATE_KEY" ]; then gpg --batch --yes --armor --detach-sign SHA256SUMS; fi
          cat SHA256SUMS

      - name: Note unsigned prerelease
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "::warning::No signing key in the release environment; this prerelease's assets are unsigned"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The Debian package, built separately on Debian stable. Not GPG-signed
  # individually (apt verifies repositories, not .deb files); it is covered
  # by the signed SHA256SUMS and by the provenance attestation.
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - name: Install build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential debhelper perl lintian iproute2 netbase git

      - uses: actions/checkout@v4

      - name: Build and lint
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist-deb && cp ../genfw_*.deb dist-deb/
          lintian --fail-on warning,error dist-deb/genfw_*.deb
          ls -l dist-deb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: dist-deb/
          if-no-files-found: error

  # Install the exact artifacts that will be published, on every supported
  # platform, verifying the signature where a key is present.
  verify:
    name: Verify install (${{ matrix.name }})
    needs: [build, build-deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EL7
            image: quay.io/centos/centos:7
            setup: |
              sed -i -e 's|^mirrorlist=|#mirrorlist=|g' -e 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
              yum install -y -q iptables
              install() { yum localinstall -y -q "$@"; }
          - name: EL9
            image: almalinux:9
            setup: |
              dnf install -y -q --setopt=install_weak_deps=False iptables-nft
              install() { dnf install -y -q --setopt=install_weak_deps=False "$@"; }
          - name: Fedora
            image: fedora:latest
            setup: |
              dnf install -y -q --setopt=install_weak_deps=False iptables-nft
              install() { dnf install -y -q --setopt=install_weak_deps=False "$@"; }
          - name: Debian
            image: debian:stable
            pkg: deb
            setup: |
              apt-get update -q
              install() { DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "$@"; }
          - name: Ubuntu
            image: ubuntu:latest
            pkg: deb
            setup: |
              apt-get update -q
              install() { DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends "$@"; }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: dist

      # Run via docker rather than a job container so EL7 works too (its
      # glibc is too old for the Actions Node runtime).
      - name: Install and run the built RPM
        run: |
          cat > /tmp/verify.sh <<'EOS'
          set -e
          ${{ matrix.setup }}
          if [ "${{ matrix.pkg }}" = deb ]; then
            install /dist/genfw_*.deb
            dpkg -s genfw | grep -E '^(Version|Depends)'
            dpkg -L genfw
            test -x /etc/network/if-up.d/genfw
          else
            rpm --version
            if [ -f /dist/RPM-GPG-KEY-genfw ]; then
              rpm --import /dist/RPM-GPG-KEY-genfw
              rpm -K /dist/genfw-*.noarch.rpm
              rpm -K /dist/genfw-*.src.rpm
            else
              echo "no signing key in artifacts; skipping signature check"
            fi
            install /dist/genfw-*.noarch.rpm
            rpm -qi genfw | grep -E '^(Version|Release|Signature)'
            rpm -ql genfw
          fi
          test -x /usr/sbin/genfw
          test -f /usr/lib/systemd/system/genfw-online.service
          test -x /usr/lib/NetworkManager/dispatcher.d/90-genfw
          cd /src/t/sample
          /usr/sbin/genfw -d 2> >(grep -v '^d: ' >&2) > /tmp/sample.rules
          rules=$(grep -c '^-A' /tmp/sample.rules)
          echo "generated $rules rules with the installed genfw"
          test "$rules" -gt 50
          EOS
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" -v /tmp/verify.sh:/verify.sh:ro \
            ${{ matrix.image }} bash /verify.sh

  release:
    name: Publish release
    needs: [build, build-deb, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: dist

      # The .deb was built after SHA256SUMS was signed; add its checksum in
      # a second, separately signed file rather than re-sign here (the key
      # only lives in the build job's environment).
      - name: List assets
        run: |
          cd dist && sha256sum genfw_*.deb > SHA256SUMS.deb && ls -l && cat SHA256SUMS SHA256SUMS.deb

      # Keyless provenance: proves these files were built by this workflow
      # at this commit. Verify with: gh attestation verify <file> --owner silug
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/genfw-*.tar.gz
            dist/genfw-*.rpm
            dist/genfw_*.deb

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'false' }}
